[project]
name = "flux-delegate-starter"
version = "0.2.0"
description = "Build and send raw delegated fluxnode START transactions"
readme = "README.md"
requires-python = ">=3.13"
keywords = ["flux", "fluxnode", "blockchain", "cryptocurrency", "delegates", "transaction", "secp256k1"]
authors = [
    {name = "David White", email = "david@runonflux.io"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "aiohttp>=3.14.3",
    "base58>=2.1.1",
    "certifi>=2026.1.4",
    "coincurve>=21.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyrage>=1.3.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.21.1",
]

[project.urls]
Homepage = "https://github.com/RunOnFlux/flux-delegate-starter"
Repository = "https://github.com/RunOnFlux/flux-delegate-starter"
Issues = "https://github.com/RunOnFlux/flux-delegate-starter/issues"

[project.scripts]
flux-delegate-starter = "flux_delegate_starter.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "ty>=0.0.89",
]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...)/typer.Argument(...) as argument defaults is the required
# Typer idiom, not the mutable-default-argument bug B008 flags.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
include = ["src", "tests"]
